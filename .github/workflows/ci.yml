# CI pipeline for the PGAT monorepo (backend: Django, frontend: Next.js).
#
# Jira connection: this repo is linked to Jira via the "GitHub for Jira" app.
# Including the issue key (e.g. PGAT-22) in the branch name / commit message
# makes Jira surface these check runs (builds) on the issue automatically.
# See docs/jira-integration.md for details and the optional gajira upgrade.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'True'
        run: python manage.py migrate

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'True'
        run: python manage.py test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
